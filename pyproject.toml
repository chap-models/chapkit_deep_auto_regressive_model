[project]
name = "chapkit-deep-auto-regressive"
version = "0.1.0"
description = "Chapkit service for the deep auto-regressive (RNN, flax/jax) Chap model, weekly and monthly"
readme = "README.md"
license = { text = "AGPLv3 license" }
authors = [
    { name = "Morten Hansen", email = "morten@winterop.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "chapkit>=2.5.0,<3",
    # The network and its training (src/chapkit_deep_auto_regressive/core/).
    "flax>=0.12.12",
    "jax>=0.12.0",
    "optax>=0.2.9",
    "scipy>=1.18.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    # The train module reads the Chap model-configuration YAML.
    "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "mypy>=1.20.2",
    "pyright>=1.1.409",
    "pandas-stubs>=3.0.0.260204",
    "types-pyyaml>=6.0.12.20260408",
    "scipy-stubs>=1.17.1",
    "pytest>=8.0",
    "uvicorn[standard]>=0.30.0",
    "httpx2>=2.16",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
select = ["E", "W", "F", "I", "D", "S"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests assert, run subprocesses and unpickle their own fixtures; fine outside product code.
"tests/**/*.py" = ["D", "S101", "S301", "S603", "S607"]
# The comparison tools run the reference models and this one as subprocesses.
"tools/**/*.py" = ["S603", "S607"]
"scripts/**/*.py" = ["D", "S"]
"**/__init__.py" = ["D104"]
"src/**/*.py" = ["D102", "D105", "D107"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "tools", "main.py"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true
mypy_path = ["src", "tools"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# optax ships no type information and has no stub package.
[[tool.mypy.overrides]]
module = ["optax.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests", "tools", "main.py"]
exclude = ["**/.venv"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportPrivateUsage = false
# optax ships no type information and has no stub package; pyright reads its source instead.
reportMissingTypeStubs = false
reportUnusedFunction = false
reportUnknownMemberType = false
